.num{font-variant-numeric:tabular-nums}
img.av{object-fit:cover}
.av.sm{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--fdisp);font-weight:600;font-size:12px;color:#fff;background:var(--steel);flex:none;overflow:hidden}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes drift{0%{transform:translate(-4%,-3%) rotate(0)}100%{transform:translate(5%,4%) rotate(8deg)}}
@keyframes pulse{0%,100%{box-shadow:0 12px 34px -8px rgba(8,96,48,.55)}50%{box-shadow:0 16px 48px -6px rgba(8,96,48,.78)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* SPLASH */
.splash{position:fixed;inset:0;z-index:200;background:var(--ink-2);color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .55s ease,transform .55s ease}
.splash.gone{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-bg{position:absolute;width:160%;height:160%;left:-30%;top:-30%;background:radial-gradient(38% 38% at 30% 32%,rgba(8,96,48,.4),transparent 60%),radial-gradient(42% 42% at 72% 66%,rgba(0,214,202,.4),transparent 60%);filter:blur(34px);animation:drift 15s ease-in-out infinite alternate}
.splash-inner{position:relative;text-align:center;padding:28px;max-width:480px}
.splash-lock{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px}
.wm{font-family:var(--fdisp);font-weight:700;letter-spacing:.5px;line-height:1;display:inline-flex;align-items:center;background:var(--orange);color:#111;padding:8px 13px;border-radius:8px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.wm .p{color:#111}
.splash-lock .xt{color:#5B626D;font-size:20px}
.splash-lock .jt{color:var(--jt);font-weight:700;font-size:20px;letter-spacing:-.3px}
.lg-bd{height:26px;width:auto;display:block}
.lg-jt{height:30px;width:30px;border-radius:7px;display:block}
.lg-x{color:#5B626D;font-size:15px}
.sl-bd{height:42px;width:auto;display:block}
.sl-jt{height:54px;width:54px;border-radius:13px;display:block}
.splash-k{font-family:var(--fdisp);font-weight:600;text-transform:uppercase;letter-spacing:3px;font-size:13px;color:#AEB6C1}
.splash-h{font-family:var(--fdisp);font-weight:700;font-size:clamp(46px,13vw,72px);line-height:.95;letter-spacing:-1px;margin:10px 0 16px}
.splash-p{color:#B9C0CB;font-size:16px;line-height:1.55;margin:0 auto 32px;max-width:360px}
.start-btn{border:0;background:var(--grad);color:#fff;font-family:var(--fdisp);font-weight:600;font-size:20px;letter-spacing:.5px;text-transform:uppercase;padding:18px 46px;border-radius:16px;box-shadow:0 12px 34px -8px rgba(8,96,48,.6);animation:pulse 2.2s ease-in-out infinite}
.start-btn:active{transform:scale(.97)}
.splash-foot{margin-top:32px;color:#5B626D;font-size:12px}
@media(prefers-reduced-motion:reduce){.splash-bg,.start-btn,.card,.bar i,.tile .tbar i,.qb i,.cov .cb i,.pdvbar i{animation:none!important}}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 11px) 18px 11px;display:flex;align-items:center;gap:12px;border-bottom:2px solid transparent;border-image:var(--grad2) 1}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .wm{font-size:16px;padding:5px 9px}
.brand .op{font-size:11px;color:#B9C0CB;line-height:1.15}
.brand .op b{color:var(--jt);font-weight:700}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.period{font-family:var(--fdisp);font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#F0B818;white-space:nowrap}
.toggle{display:flex;background:#1C6E40;border-radius:9px;padding:3px}
.toggle button{border:0;background:transparent;color:#AEB6C1;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:6px}
.toggle button.on{background:var(--orange);color:#111}
.lockbtn{background:#1C6E40;border:0;color:#8A929E;padding:8px 10px;border-radius:8px;display:grid;place-items:center;line-height:0;cursor:pointer}
.lockbtn:hover{color:#fff}

.wrap{max-width:1200px;margin:0 auto;padding:20px}
.wrap.narrow{max-width:600px}
.wrap.detail{max-width:960px}

/* SEARCH */
.searchhead{font-family:var(--fdisp);font-weight:700;font-size:clamp(28px,7vw,38px);letter-spacing:-.3px;margin:10px 0 4px}
.searchsub{color:var(--muted);font-size:15px;margin-bottom:18px}
.search{position:relative;margin-bottom:16px}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:18px 18px 18px 52px;font-size:17px;outline:none;box-shadow:var(--sh)}
.search input:focus{border-color:var(--orange)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.starthint{text-align:center;color:var(--muted);font-size:14.5px;padding:30px 20px}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;text-align:left;box-shadow:var(--sh);width:100%;transition:transform .1s}
.pcard:active{transform:scale(.99)}
.pcard .av{width:54px;height:54px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:var(--fdisp);font-weight:600;font-size:19px;color:#fff;background:var(--steel);overflow:hidden}
.pcard .nm{font-weight:600;min-width:0;font-size:16.5px}
.pcard .nm small{display:block;color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .go{margin-left:auto;color:var(--muted-2);font-size:26px;flex:none}
.empty{text-align:center;color:var(--muted);padding:32px 10px}
.seg-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--orange-soft);color:var(--orange-d);white-space:nowrap}
.seg-badge.pv{background:#D4F7F4;color:#008B84}

/* DETAIL */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:6px 0;margin-bottom:8px}

.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--grad)}
.hphoto{width:clamp(148px,38vw,190px);aspect-ratio:1;border-radius:50%;padding:4px;background:var(--grad);margin:6px auto 18px;box-shadow:0 0 0 6px rgba(255,255,255,.04),0 16px 44px -10px rgba(8,96,48,.55)}
.hphoto img,.hinit{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid #07421F}
.hinit{display:grid;place-items:center;background:#0E5A30;color:#fff;font-family:var(--fdisp);font-weight:600;font-size:clamp(40px,10vw,52px)}
.hero-name{font-size:clamp(22px,5.4vw,30px);font-weight:700;line-height:1.15}
.hero-cargo{color:#AEB6C1;font-size:14px;margin-top:7px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.hero-pct{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.18);font-family:var(--fdisp);font-weight:700;font-size:clamp(76px,22vw,104px);line-height:.9;letter-spacing:-2px;margin-top:18px}
.hero-pct span{font-size:.42em;letter-spacing:0}
.hero-state{font-family:var(--fdisp);font-weight:600;text-transform:uppercase;letter-spacing:1.5px;font-size:clamp(14px,3.6vw,17px);margin-top:4px}
.hero-sub{color:#B9C0CB;font-size:14px;margin-top:10px}
.d-ok{color:#39D98A}.d-warn{color:#FFB020}.d-bad{color:#FF6B6B}
.hgwrap{position:relative;width:clamp(196px,50vw,244px);aspect-ratio:1;margin:6px auto 18px}
.hgsvg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 30px rgba(8,96,48,.35))}
.hgphoto{position:absolute;inset:0;margin:auto;width:73%;height:73%;border-radius:50%;overflow:hidden;border:3px solid #07421F;background:#0E5A30}
.hgphoto img{width:100%;height:100%;object-fit:cover;display:block}
.hgphoto .hinit{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-family:var(--fdisp);font-weight:600;font-size:clamp(38px,9vw,52px)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px}
.badge{text-align:center;opacity:.42}
.badge.on{opacity:1}
.medal{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:23px;color:#fff;background:#C7CDD5}
.badge.on .medal{background:linear-gradient(135deg,#FFD24D,#F0A818 58%,#D98A12);box-shadow:0 6px 18px -4px rgba(8,96,48,.55)}
.blabel{font-size:11px;font-weight:600;color:var(--muted);line-height:1.25}
.badge.on .blabel{color:var(--ink)}
.cmp-head{font-size:14.5px;margin-bottom:2px;line-height:1.4}
.cmp-bar{position:relative;height:16px;background:#EDEFF2;border-radius:999px;margin:30px 0 10px;overflow:visible}
.cmp-fill{height:100%;border-radius:999px;transform-origin:left;animation:growx .8s ease both}
.cmp-mark{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed #98A0AC}
.cmp-mark.meta{border-color:var(--meta)}
.cmp-mark span{position:absolute;top:-21px;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap;color:#78808C;font-family:var(--fdisp)}
.cmp-mark.meta span{color:var(--meta)}
.cmp-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.cmp-legend b{color:var(--ink)}
.weekly{display:flex;gap:10px;justify-content:space-around;align-items:flex-end;padding-top:6px}
.wk{flex:1;max-width:90px;text-align:center}
.wkval{font-family:var(--fdisp);font-weight:700;font-size:16px;margin-bottom:6px}
.wkbar{position:relative;width:58%;max-width:50px;height:146px;margin:0 auto;background:#EDEFF2;border-radius:9px;overflow:hidden}
.wkbar i{position:absolute;left:0;right:0;bottom:0;border-radius:7px 7px 0 0;transform-origin:bottom;animation:wkgrow .7s cubic-bezier(.22,1,.36,1) both}
.wkmeta{position:absolute;left:0;right:0;border-top:2px dashed var(--meta);z-index:2}
.wklbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:9px}
@keyframes wkgrow{from{transform:scaleY(0)}}
.tibig{font-family:var(--fdisp);font-weight:700;font-size:clamp(30px,7vw,38px);line-height:1.05}
.tirow{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted);padding:8px 0;border-bottom:1px dashed var(--line)}
.tirow:last-child{border-bottom:0}
.tirow b{font-weight:700;color:var(--ink)}
.tibar{height:11px;background:#EDEFF2;border-radius:999px;overflow:hidden}
.tibar i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:growx .8s ease both}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:clamp(16px,3vw,22px);margin-bottom:14px;animation:rise .5s ease both}
.card-t{font-family:var(--fdisp);font-weight:600;text-transform:uppercase;letter-spacing:.8px;font-size:13px;color:var(--muted);margin-bottom:14px}
.is-ok{color:var(--ok)}.is-warn{color:var(--warn)}.is-bad{color:var(--bad)}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}

.dgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:840px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .full{grid-column:1/-1}}

/* actividad summary + donut */
.act-summary{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut-arc{animation:fadein 1s ease both}
.act-stats{flex:1;min-width:160px;display:flex;flex-direction:column;gap:9px;font-size:14.5px;color:var(--muted)}
.act-stats b{color:var(--ink);font-family:var(--fdisp);font-weight:700;font-size:19px;margin-right:4px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:520px){.tiles{grid-template-columns:1fr 1fr 1fr}}
.tile{border:1px solid var(--line);border-radius:16px;padding:15px;background:linear-gradient(180deg,#fff,#FBFCFD)}
.tile .tl{font-size:13px;font-weight:600;color:var(--ink);min-height:34px;line-height:1.2}
.tile .tv{font-family:var(--fdisp);font-weight:700;font-size:clamp(34px,8vw,42px);line-height:1;margin:4px 0 4px}
.tile .tv span{font-size:.48em}
.tile .tsub{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.tile .tbar{height:9px;background:#EDEFF2;border-radius:999px;overflow:hidden}
.tile .tbar i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:growx .8s cubic-bezier(.22,1,.36,1) both}

/* insights */
.ins{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px;line-height:1.5}
.ins:last-child{border-bottom:0}
.ins .ico{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:13px;background:var(--grad);color:#fff;margin-top:1px;font-weight:700}
.ins b{font-weight:700}

/* qué falta */
.pdvbar{height:14px;background:#EDEFF2;border-radius:999px;overflow:hidden;display:flex}
.pdvbar i{height:100%;transform-origin:left;animation:growx .8s ease both}
.qrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.qrow .ql{width:120px;flex:none;font-size:13.5px;font-weight:600}
.qrow .qb{flex:1;height:10px;background:#EDEFF2;border-radius:999px;overflow:hidden}
.qrow .qb i{display:block;height:100%;background:var(--jt);border-radius:999px;transform-origin:left;animation:growx .8s ease both}
.qrow .qv{flex:none;font-size:13px;color:var(--muted);width:78px;text-align:right;font-weight:600}
.cap-note{font-size:12px;color:var(--muted);margin-top:5px}

/* pdv list */
.filters{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pdvgrid{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:640px){.pdvgrid{grid-template-columns:1fr 1fr}}
.pdv{border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:var(--card)}
.pdv-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pdv-h .nm{font-weight:600;font-size:14.5px;min-width:0;line-height:1.2}
.pdv-h .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.pdv-h .sc{margin-left:auto;font-family:var(--fdisp);font-weight:700;font-size:19px;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.ac{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:#F1F3F5;color:var(--muted)}
.ac.done{background:var(--ok-soft);color:var(--ok)}
.ac.half{background:var(--warn-soft);color:var(--warn)}
.ac .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--sh)}
.kpi .k{font-family:var(--fdisp);font-weight:700;font-size:34px;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:6px;font-weight:600}
.kpi.accent{background:var(--ink);color:#fff}.kpi.accent .l{color:#AEB6C1}
.segfilter{display:inline-flex;background:#E5E8EC;border-radius:12px;padding:4px;margin-bottom:16px;flex-wrap:wrap;gap:2px}
.segtab{border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;padding:9px 17px;border-radius:9px;cursor:pointer}
.segtab.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.segrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.segrow:last-child{border-bottom:0}
.segrow .big{font-family:var(--fdisp);font-weight:700;font-size:28px;width:82px;flex:none}
.segrow .meta-s{font-size:12.5px;color:var(--muted)}
.cov{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cov .cl{width:130px;flex:none;font-size:13.5px;font-weight:600}
.cov .cb{flex:1;height:12px;background:#EDEFF2;border-radius:999px;overflow:hidden}
.cov .cb i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:growx .8s ease both}
.cov .cv{width:50px;text-align:right;font-family:var(--fdisp);font-weight:700;flex:none}
.tbar2{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tbar2 input,.tbar2 select{border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px;background:var(--card);outline:none}
.tbar2 input{flex:1;min-width:160px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 15px;font-size:13.5px;font-weight:600}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.qr{padding:6px 11px;font-size:12px}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:660px}
thead th{text-align:left;font-family:var(--fdisp);font-weight:600;text-transform:uppercase;letter-spacing:.4px;font-size:11.5px;color:var(--muted);padding:12px 15px;border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:#FAFBFC}
thead th.r,tbody td.r{text-align:right}
thead th.c,tbody td.c{text-align:center;cursor:default}
tbody td{padding:12px 15px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FAFBFC}
.rank{color:var(--muted-2);font-family:var(--fdisp);font-weight:600;width:30px}
.tp{font-family:var(--fdisp);font-weight:700;font-size:17px}
.mini{width:74px;height:8px;background:#EDEFF2;border-radius:999px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.mini i{display:block;height:100%}
.callout{display:flex;gap:11px;background:var(--warn-soft);border:1px solid #F3D9AE;border-radius:14px;padding:13px 16px;margin-bottom:16px;font-size:13.5px;color:#8A5A12}
.callout b{color:#6E4508}
.podio{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px;align-items:end}
.podstep{background:linear-gradient(180deg,#fff,#F9FAFB);border:1px solid var(--line);border-radius:16px;padding:16px 10px 14px;text-align:center;position:relative;cursor:pointer}
.podstep.first{padding-top:26px;border-color:rgba(241,196,15,.5);box-shadow:0 10px 28px -12px rgba(8,96,48,.5)}
.podrank{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--fdisp);font-weight:700;font-size:14px;color:#3a2b00;border:2px solid #fff}
.podphoto{width:66px;height:66px;border-radius:50%;padding:3px;margin:0 auto 9px}
.podstep.first .podphoto{width:86px;height:86px}
.podname{font-weight:600;font-size:13px;line-height:1.2}
.podpct{font-family:var(--fdisp);font-weight:700;font-size:26px;margin-top:4px}
.podstep.first .podpct{font-size:32px}
.podseg{font-size:11px;color:var(--muted);margin-top:2px}
.dot-l{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:middle}
.hbar{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.hbar:last-child{margin-bottom:0}
.hbl{width:132px;flex:none;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbb{flex:1;height:11px;background:#EDEFF2;border-radius:999px;overflow:hidden}
.hbb i{display:block;height:100%;transform-origin:left;animation:growx .8s ease both}
.hbv{flex:none;width:72px;text-align:right;font-size:11px;color:var(--muted)}
.hbv b{font-family:var(--fdisp);font-size:15px;margin-right:5px}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:12px;align-items:center;background:#FCFBFA;border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:11px;padding:12px 14px;font-size:13.5px}
.alert .an{font-family:var(--fdisp);font-weight:700;font-size:20px;color:var(--bad);flex:none;min-width:46px;text-align:center}
.mapcard{position:relative}
.mapbox{height:460px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#07421F}
.mapcard.mapfull{position:fixed;inset:0;z-index:160;margin:0;border-radius:0;padding:16px;display:flex;flex-direction:column}
.mapcard.mapfull .mapwrap{flex:1}
.mapcard.mapfull .mapbox{height:100%}
.mapchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
.mchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.mchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mchip .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.mlbl{font-size:11.5px;color:var(--muted);margin-right:2px}
.mapstat{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.mapstat b{color:var(--ink);font-family:var(--fdisp)}
.mapwrap{position:relative}
.mapexpand{position:absolute;top:10px;right:10px;z-index:500;background:var(--ink);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.mkr{display:block;width:12px;height:12px;border-radius:50%;border:2px solid #07421F;box-shadow:0 0 0 1px rgba(255,255,255,.28)}
.mkr.pulse{animation:mpulse 1.5s infinite}
@keyframes mpulse{0%{box-shadow:0 0 0 0 rgba(216,49,49,.55)}70%{box-shadow:0 0 0 11px rgba(216,49,49,0)}100%{box-shadow:0 0 0 0 rgba(216,49,49,0)}}
.clus{border-radius:50%;display:grid;place-items:center;font-family:var(--fdisp);font-weight:700;color:#141414;background:radial-gradient(circle at 35% 30%,#0F8A47,#086030);border:2px solid #fff;box-shadow:0 5px 16px -5px rgba(0,0,0,.55)}
.pop-pct{font-family:var(--fdisp);font-weight:700;font-size:16px}
.pop-bar{height:6px;background:#EDEFF2;border-radius:999px;overflow:hidden;margin-top:5px}
.pop-bar i{display:block;height:100%}
.leaflet-popup-content-wrapper{border-radius:12px}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted);align-items:center}
.trendwrap svg{width:100%;height:auto;display:block}
.leaflet-popup-content{font-family:var(--fbody);font-size:12.5px;line-height:1.4}
.spark{vertical-align:middle}
.foot{color:var(--muted-2);font-size:12px;text-align:center;padding:22px 12px 36px;line-height:1.6}

/* modal QR */
.modal{position:fixed;inset:0;z-index:150;background:rgba(15,17,20,.6);display:none;align-items:center;justify-content:center;padding:20px;animation:fadein .2s ease}
.modal-card{background:#fff;border-radius:22px;padding:24px;max-width:320px;width:100%;text-align:center;position:relative;box-shadow:0 20px 60px -12px rgba(0,0,0,.4)}
.modal-x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:26px;color:var(--muted-2);line-height:1}
.qr-name{font-weight:700;font-size:18px;margin-top:4px}
.qr-sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.qrbox{display:flex;justify-content:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:190px;align-items:center}
.qrbox img,.qrbox canvas{display:block}
.qr-link{font-size:11.5px;color:var(--muted);word-break:break-all;margin-top:12px;background:#F6F7F9;border-radius:9px;padding:8px 10px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.period{display:none}.cov .cl{width:104px}}

.av{overflow:hidden;background:#E3F0E8}
.av>img,.av>svg{width:100%;height:100%;object-fit:cover;display:block}
.av>.avini{width:100%;height:100%;display:grid;place-items:center;font-family:var(--fdisp);font-weight:600;color:#fff;background:var(--steel)}
.hgphoto>img,.hgphoto>svg{width:100%;height:100%;object-fit:cover;display:block;border:3px solid #07421F;box-sizing:border-box}
.hgphoto>.avini{width:100%;height:100%;display:grid;place-items:center;font-family:var(--fdisp);font-weight:600;color:#fff;font-size:clamp(34px,8vw,48px);background:#0E5A30}
.podphoto>img,.podphoto>svg{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.podphoto>.avini{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;background:var(--steel);color:#fff;font-family:var(--fdisp);font-weight:700}
.slwm{background:#fff;border-radius:8px;padding:5px 10px;display:inline-flex;align-items:center;line-height:0}
.slwm img{height:22px;width:auto;display:block}
.slwm.sl{padding:9px 16px;border-radius:14px}
.slwm.sl img{height:42px}
</style>

  const acts=SEG_ACTS[p.segmento],N=acts.length,cx=150,cy=120,R=80,LR=100;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N,r=R*Math.max(v,0)/100;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let grid="";[25,50,75,100].forEach((g,gi)=>{grid+=`<polygon points="${acts.map((_,i)=>pt(i,g).join(",")).join(" ")}" fill="${gi===3?'#FBFCFD':'none'}" stroke="#EDF0F3" stroke-width="1"/>`;});
  let axes="",labels="";
  acts.forEach((k,i)=>{const[x,y]=pt(i,100);axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#F1F3F6" stroke-width="1"/>`;
    const a=-Math.PI/2+i*2*Math.PI/N,lx=cx+LR*Math.cos(a),ly=cy+LR*Math.sin(a),v=p.rates[k]||0,anc=Math.abs(lx-cx)<12?"middle":(lx>cx?"start":"end");
    labels+=`<text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="9.5" font-weight="600" fill="#78808C">${ACT_SHORT[k]}</text><text x="${lx}" y="${ly+13}" text-anchor="${anc}" font-family="Oswald,sans-serif" font-size="12" font-weight="700" fill="#07421F">${v}%</text>`;});
  const metaPts=acts.map((_,i)=>pt(i,META).join(",")).join(" ");
  const valPts=acts.map((k,i)=>pt(i,p.rates[k]||0).join(",")).join(" ");
  const dots=acts.map((k,i)=>{const[x,y]=pt(i,p.rates[k]||0);return `<circle cx="${x}" cy="${y}" r="3.6" fill="#086030" stroke="#fff" stroke-width="1.6"/>`;}).join("");
  return `<svg viewBox="0 0 300 252" width="100%" style="max-width:460px;display:block;margin:4px auto 0">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F8A47"/><stop offset="1" stop-color="#064A25"/></linearGradient></defs>
    ${grid}${axes}<polygon points="${metaPts}" fill="none" stroke="#D42A2A" stroke-width="1.4" stroke-dasharray="4 3" opacity=".55"/>
    <polygon class="donut-arc" points="${valPts}" fill="url(#rg)" fill-opacity=".36" stroke="url(#rg)" stroke-width="2.6" stroke-linejoin="round"/>${dots}${labels}
    <circle cx="${cx}" cy="${cy}" r="1.8" fill="#C7CDD5"/></svg>`;
}

function heroGauge(p){

  const ma=(-90+360*META/100)*Math.PI/180,x1=(100+80*Math.cos(ma)).toFixed(1),y1=(100+80*Math.sin(ma)).toFixed(1),x2=(100+104*Math.cos(ma)).toFixed(1),y2=(100+104*Math.sin(ma)).toFixed(1);
  const inner=avInner(p);

    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F8A47"/><stop offset="1" stop-color="#064A25"/></linearGradient></defs>
    <circle cx="100" cy="100" r="${R}" fill="none" stroke="#10603A" stroke-width="11"/>
    <circle id="hgauge" cx="100" cy="100" r="${R}" fill="none" stroke="url(#gg)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" transform="rotate(-90 100 100)"/>
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FF5B5B" stroke-width="3" stroke-linecap="round"/></svg>

function confetti(){ if(RM)return;
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:120';document.body.appendChild(cv);
  const ctx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight,cols=['#086030','#F0B818','#FFC53D','#159A4B','#ffffff'],P=[];
  for(let i=0;i<150;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*0.4,vx:(Math.random()-.5)*3.5,vy:2+Math.random()*4,s:5+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});
  let fr=0;(function d(){fr++;ctx.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();}if(fr<190)requestAnimationFrame(d);else cv.remove();})();
}
function badgeList(p){const acts=SEG_ACTS[p.segmento],it=[];
  acts.forEach(k=>{ if(ASESOR.has(k))it.push({label:ACT_LABEL[k],earned:(p.rates[k]||0)>=100,icon:'◎'}); else it.push({label:ACT_LABEL[k]+' 100%',earned:(p.rates[k]||0)>=100,icon:'✓'});});
  it.push({label:'Meta del mes',earned:p.cumplimiento>=META,icon:'★'});return it;}
function sectionCompare(p){const same=DATA.promotores.filter(x=>x.segmento===p.segmento),seg=DATA.segmentos.find(s=>s.segmento===p.segmento);
  const avg=seg?seg.cumpl_prom:0,below=same.filter(x=>x.cumplimiento<p.cumplimiento).length,pct=same.length>1?Math.round(100*below/(same.length-1)):0;
  return {avg,pct,n:same.length};}
function insights(p){
  const acts=SEG_ACTS[p.segmento],w=100/acts.length,gap=Math.max(META-p.cumplimiento,0);
  const levers=acts.map(k=>({k,label:ACT_LABEL[k],rate:p.rates[k]||0,gain:w*(100-(p.rates[k]||0))/100})).sort((a,b)=>b.gain-a.gain);
  const pdvActs=acts.filter(k=>!ASESOR.has(k));
  const missing=pdvActs.map(k=>({k,label:ACT_LABEL[k],n:p.pdvs.filter(x=>(x.acts[k]||0)<1).length,done:p.pdvs.filter(x=>(x.acts[k]||0)>=1).length})).sort((a,b)=>b.n-a.n);
  const done=p.pdvs.filter(x=>x.score>=1).length;
  const visited=p.pdvs.filter(x=>x.score>0).length;
  const totalCap=p.pdvs.reduce((s,x)=>s+pdvActs.filter(k=>(x.acts[k]||0)>=1).length,0);
  return {acts,w,gap,levers,missing,done,visited,totalCap,total:p.pdvs.length,pdvActs};
}

function animateHero(){
  const el=document.getElementById('hpct'),g=document.getElementById('hgauge');
  const to=el?(parseFloat(el.textContent)||0):0;
  const C=g?(parseFloat(g.getAttribute('stroke-dasharray'))||0):0, target=C*(1-Math.min(to,100)/100);
  if(RM){if(g)g.setAttribute('stroke-dashoffset',target.toFixed(1));return;}
  if(g)g.setAttribute('stroke-dashoffset',C.toFixed(1)); if(el)el.textContent="0";
  let st=null;
  function f(t){if(!st)st=t;const pr=Math.min((t-st)/1000,1),e=pr*(2-pr);
    if(el)el.textContent=(Math.round(to*e*10)/10);
    if(g)g.setAttribute('stroke-dashoffset',(C-(C-target)*e).toFixed(1));
    if(pr<1)requestAnimationFrame(f);else{if(el)el.textContent=to;if(g)g.setAttribute('stroke-dashoffset',target.toFixed(1));}}
  requestAnimationFrame(f);
  if(to>=META)setTimeout(confetti,450);
}

function rankTable(){const th=(k,l,ex)=>`<th class="${ex||''}" onclick="sortA('${k}')">${l}${aSort.key===k?(aSort.dir>0?' ▲':' ▼'):''}</th>`;
  const trs=rankRows().map((p,i)=>{const b=band(p.cumplimiento);return `<tr onclick="openP('${p.cedula}','admin')"><td class="rank num">${i+1}</td><td><div style="display:flex;align-items:center;gap:10px">${avatar(p,'sm')}<div><div style="font-weight:600">${esc(p.nombre)}</div><div style="color:var(--muted);font-size:12px">CC ${esc(p.cedula)}</div></div></div></td><td><span class="seg-badge ${p.segmento==='Punto de Venta'?'pv':''}">${p.segmento}</span></td><td style="color:var(--muted)">${esc(p.jefe||'—')}</td><td class="r num">${p.n_pdv}</td><td class="r"><span class="tp is-${b} num">${p.cumplimiento}%</span><span class="mini"><i class="bg-${bandBar(p.cumplimiento)}" style="width:${Math.max(p.cumplimiento,2)}%"></i></span></td><td class="c"><button class="btn qr" onclick="event.stopPropagation();showQR('${p.cedula}')">QR</button></td></tr>`;}).join("");
  return `<table><thead><tr><th class="rank">#</th>${th('nombre','Promotor')}${th('segmento','Sección')}<th>Jefe</th>${th('n_pdv','PDV','r')}${th('cumplimiento','Cumplimiento','r')}<th class="c">Acceso</th></tr></thead><tbody>${trs||'<tr><td colspan="7" class="empty">Sin resultados.</td></tr>'}</tbody></table>`;}
function updateRank(){const t=document.getElementById('ranktable');if(t)t.innerHTML=rankTable();const as=document.getElementById('aseg');if(as)as.value=aSeg;const aj=document.getElementById('ajefe');if(aj)aj.value=aJefe;const ar=document.getElementById('areg');if(ar)ar.value=aReg;}
function wireAdmin(){const aq=document.getElementById('aq');if(aq)aq.oninput=e=>{aQuery=e.target.value;updateRank();};const as=document.getElementById('aseg');if(as)as.onchange=e=>{aSeg=e.target.value;updateRank();};const aj=document.getElementById('ajefe');if(aj)aj.onchange=e=>{aJefe=e.target.value;updateRank();};const ar=document.getElementById('areg');if(ar)ar.onchange=e=>{aReg=e.target.value;updateRank();};}
function scrollRank(){const t=document.getElementById('ranktop');if(t)t.scrollIntoView({behavior:'smooth',block:'start'});}
function drillReg(r){aReg=(aReg===r?'':r);updateRank();scrollRank();}
function drillJefe(j){aJefe=(aJefe===j?'':j);updateRank();scrollRank();}
function drillAct(k){aSort={key:'act:'+k,dir:-1};updateRank();scrollRank();}
function mapCard(){const chip=(f,v,lbl,dot)=>`<button class="mchip" id="msc_${f}_${mslug(v)}" onclick="setMap('${f}','${jss(v)}')">${dot?`<span class="cdot" style="background:${dot}"></span>`:''}${lbl}</button>`;
  return `<div class="card mapcard" id="mapcard"><div class="card-t">Mapa de PDV · cumplimiento en vivo</div>
    <div class="mapchips"><span class="mlbl">Sección:</span>${chip('seg','','Todas')}${DATA.segmentos.map(s=>chip('seg',s.segmento,s.segmento)).join('')}<span style="width:6px"></span><span class="mlbl">Estado:</span>${chip('band','','Todos')}${chip('band','ok','En meta','#159A4B')}${chip('band','warn','En proceso','#E8912B')}${chip('band','bad','Crítico','#D42A2A')}</div>
    <div class="mapstat" id="mapstat"></div>
    <div class="mapwrap"><button class="mapexpand" onclick="toggleMapFull()">⛶ Pantalla completa</button><div id="map" class="mapbox"></div></div></div>`;}
function mslug(s){return String(s).replace(/[^a-zA-Z]/g,'-');}
function bandOf(v){return v>=META?'ok':(v>=50?'warn':'bad');}
function colOf(b){return b==='ok'?'#159A4B':(b==='warn'?'#E8912B':'#D42A2A');}
function initMap(){const el=document.getElementById('map');if(!el||!window.L)return;if(MAP){MAP.remove();MAP=null;}
  MAP=L.map(el,{scrollWheelZoom:false,preferCanvas:true,maxZoom:16}).setView([4.6,-74.1],5);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Tiles © Esri'}).addTo(MAP);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(MAP);
  MCLUSTER=(L.markerClusterGroup?L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:48,spiderfyOnMaxZoom:true,iconCreateFunction:c=>{const n=c.getChildCount(),s=n<10?36:n<50?46:56;return L.divIcon({html:`<div class="clus" style="width:${s}px;height:${s}px;font-size:${n<100?14:12}px">${n}</div>`,className:'',iconSize:[s,s]});}}):L.layerGroup());
  MAP.addLayer(MCLUSTER);populateMap(true);syncMapChips();}
function populateMap(fit){if(!MCLUSTER)return;MCLUSTER.clearLayers();const pts=[];let n=0,ok=0,wa=0,ba=0;
  DATA.promotores.forEach(p=>{if(adminSeg&&p.segmento!==adminSeg)return;if(mapSeg&&p.segmento!==mapSeg)return;p.pdvs.forEach(x=>{if(!x.lat||!x.lng)return;const sc=Math.round((x.score||0)*100),b=bandOf(sc);if(mapBand&&b!==mapBand)return;
    const mk=L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',iconSize:[14,14],html:`<span class="mkr${b==='bad'?' pulse':''}" style="background:${colOf(b)}"></span>`})});
    mk.bindPopup(`<b>${esc(x.nombre||('PDV '+x.id))}</b><br><span style="color:#667085;font-size:11px">${esc(p.nombre)}${x.municipio?' · '+esc(x.municipio):''}</span><div style="margin-top:5px"><span class="pop-pct" style="color:${colOf(b)}">${sc}%</span> <span style="font-size:11px;color:#667085">captura del PDV</span></div><div class="pop-bar"><i style="width:${Math.max(sc,3)}%;background:${colOf(b)}"></i></div>`);
    MCLUSTER.addLayer(mk);pts.push([x.lat,x.lng]);n++;b==='ok'?ok++:b==='warn'?wa++:ba++;});});
  const st=document.getElementById('mapstat');if(st)st.innerHTML=`Mostrando <b>${n}</b> PDV · <b style="color:#159A4B">${ok}</b> en meta · <b style="color:#E8912B">${wa}</b> en proceso · <b style="color:#D42A2A">${ba}</b> críticos`;
  if(fit&&pts.length)setTimeout(()=>{try{MAP.invalidateSize();MAP.fitBounds(pts,{padding:[26,26]});}catch(e){}},60);}
function setMap(f,v){if(f==='seg')mapSeg=v;else mapBand=v;syncMapChips();populateMap(false);}
function syncMapChips(){document.querySelectorAll('.mchip').forEach(c=>c.classList.remove('on'));const a=document.getElementById('msc_seg_'+mslug(mapSeg));if(a)a.classList.add('on');const b=document.getElementById('msc_band_'+mslug(mapBand));if(b)b.classList.add('on');}
function toggleMapFull(){const c=document.getElementById('mapcard');if(!c)return;c.classList.toggle('mapfull');const btn=c.querySelector('.mapexpand');if(btn)btn.textContent=c.classList.contains('mapfull')?'✕ Cerrar':'⛶ Pantalla completa';setTimeout(()=>{try{MAP.invalidateSize();}catch(e){}},90);}
function trendCard(){const H=(DATA.historico||[]).slice().sort((a,b)=>a.orden-b.orden);
  if(H.length<2){const last=H[H.length-1];return `<div class="card"><div class="card-t">Tendencia mensual</div><div class="cap-note">Se activa desde el segundo corte. Corte actual: <b>${last?esc(last.periodo):'—'}</b> · general <b>${last?last.general:'—'}%</b>. Al cargar el próximo mes aparece la línea de si sube o baja cada sección.</div></div>`;}
  return `<div class="card"><div class="card-t">Tendencia mensual</div><div class="trendwrap">${trendSVG(H)}</div></div>`;}
function trendSVG(H){const W=560,Ht=210,pl=38,pr=14,pt=16,pb=34,n=H.length;const xx=i=>pl+i*(W-pl-pr)/(n-1||1),yy=v=>Ht-pb-(Math.max(0,Math.min(v,100))/100)*(Ht-pt-pb);
  let g='';[0,25,50,75,100].forEach(v=>{g+=`<line x1="${pl}" y1="${yy(v)}" x2="${W-pr}" y2="${yy(v)}" stroke="#EDF0F3"/><text x="${pl-6}" y="${yy(v)+3}" text-anchor="end" font-size="9" fill="#98A0AC">${v}</text>`;});
  g+=`<line x1="${pl}" y1="${yy(META)}" x2="${W-pr}" y2="${yy(META)}" stroke="#D42A2A" stroke-dasharray="4 3" opacity=".6"/>`;
  H.forEach((h,i)=>{g+=`<text x="${xx(i)}" y="${Ht-12}" text-anchor="middle" font-size="9.5" fill="#667085">${esc(h.periodo)}</text>`;});
  const _cols=['#0F8A47','#F0B818','#8A6D1E','#159A4B'];const S=[['General',H.map(h=>h.general),'#086030']].concat(DATA.segmentos.map((sg,i)=>[sg.segmento,H.map(h=>(h.secciones&&h.secciones[sg.segmento])||0),_cols[i%_cols.length]]));
  let ln='';S.forEach(([nm,vals,col])=>{ln+=`<path d="${vals.map((v,i)=>`${i?'L':'M'}${xx(i).toFixed(1)} ${yy(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5"/>`;vals.forEach((v,i)=>{ln+=`<circle cx="${xx(i).toFixed(1)}" cy="${yy(v).toFixed(1)}" r="3" fill="${col}"/>`;});});
  const leg=S.map(([nm,,col])=>`<span style="font-size:11px;color:#667085;margin-right:12px"><span class="dot-l" style="background:${col}"></span>${nm}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${Ht}">${g}${ln}</svg><div style="margin-top:6px">${leg}</div>`;}
function sparkline(vals){if(vals.length<2)return '';const W=88,Ht=26,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1,x=i=>i*(W-4)/(vals.length-1)+2,y=v=>Ht-2-((v-mn)/rg)*(Ht-6);const up=vals[vals.length-1]>=vals[0];return `<svg class="spark" width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}"><path d="${vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${up?'#159A4B':'#D42A2A'}" stroke-width="2"/></svg>`;}
function AP(){return adminSeg?DATA.promotores.filter(p=>p.segmento===adminSeg):DATA.promotores;}
function actOverall(list){const L=["checkin","sugeridos","actividades","exhibiciones","agotados","capacitaciones","eventos","pop","recambios"],out=[];L.forEach(k=>{const vs=list.filter(p=>k in p.rates).map(p=>p.rates[k]);if(vs.length)out.push({kind:k,label:ACT_LABEL[k],rate:Math.round(vs.reduce((a,b)=>a+b,0)/vs.length*10)/10});});return out;}
function setAdminSeg(s){adminSeg=s;aSeg=s;selected=null;render();}
function podioPhoto(p){return avInner(p);}
function podioHTML(){const t=AP().slice(0,3);if(t.length<3)return '';const md=['#F1C40F','#B8C0CC','#CD7F32'];const order=[[t[1],2],[t[0],1],[t[2],3]];
  return `<div class="card"><div class="card-t">Podio · mejores del mes</div><div class="podio">${order.map(([p,rk])=>{const b=band(p.cumplimiento);return `<div class="podstep ${rk===1?'first':''}" onclick="openP('${p.cedula}','admin')"><div class="podrank" style="background:${md[rk-1]}">${rk}</div><div class="podphoto" style="background:linear-gradient(135deg,${md[rk-1]},#086030)">${podioPhoto(p)}</div><div class="podname">${esc(p.nombre.split(' ').slice(0,2).join(' '))}</div><div class="podpct is-${b} num">${p.cumplimiento}%</div><div class="podseg">${esc(p.segmento)}</div></div>`;}).join("")}</div></div>`;}
function distDonut(crit,proc,meta){const tot=(crit+proc+meta)||1,r=48,C=2*Math.PI*r,segs=[['#D42A2A',crit],['#E8912B',proc],['#159A4B',meta]];let off=0,arcs='';
  segs.forEach(([col,v])=>{const len=C*v/tot;arcs+=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)"/>`;off+=len;});
  return `<svg viewBox="0 0 120 120" width="112" height="112" style="flex:none">${arcs}<text x="60" y="56" text-anchor="middle" font-family="Oswald,sans-serif" font-weight="700" font-size="24" fill="#07421F">${tot}</text><text x="60" y="74" text-anchor="middle" font-size="10" fill="#667085">promotores</text></svg>`;}
function distCard(){const A=AP(),crit=A.filter(p=>p.cumplimiento<50).length,proc=A.filter(p=>p.cumplimiento>=50&&p.cumplimiento<META).length,meta=A.filter(p=>p.cumplimiento>=META).length;
  return `<div class="card"><div class="card-t">Distribución del equipo</div><div class="act-summary">${distDonut(crit,proc,meta)}<div class="act-stats"><div><span class="dot-l" style="background:#D42A2A"></span><b class="num">${crit}</b> en crítico (&lt;50%)</div><div><span class="dot-l" style="background:#E8912B"></span><b class="num">${proc}</b> en proceso (50–${META-1}%)</div><div><span class="dot-l" style="background:#159A4B"></span><b class="num">${meta}</b> en meta (≥${META}%)</div></div></div></div>`;}
function groupAvg(list,fn){const g={};list.forEach(p=>{const k=fn(p)||'—';(g[k]=g[k]||[]).push(p);});return Object.entries(g).map(([k,a])=>({label:k,val:Math.round(a.reduce((s,x)=>s+x.cumplimiento,0)/a.length*10)/10,n:a.length})).sort((x,y)=>y.val-x.val);}
function promRegional(p){const c={};p.pdvs.forEach(x=>{if(x.regional)c[x.regional]=(c[x.regional]||0)+1;});let b='',bn=-1;for(const k in c){if(c[k]>bn){bn=c[k];b=k;}}return b||'Sin regional';}
function hbars(items){return items.map(i=>{const b=band(i.val);return `<div class="hbar"><div class="hbl">${esc(i.label)}</div><div class="hbb"><i class="bg-${b}" style="width:${Math.max(i.val,1)}%"></i></div><div class="hbv"><b class="is-${b} num">${i.val}%</b>${i.n}</div></div>`;}).join("");}
function regionalCard(){return `<div class="card"><div class="card-t">Desempeño por regional <span style="font-weight:400;text-transform:none;font-size:11px">· toca para filtrar</span></div>${hbarsClickable(groupAvg(AP(),promRegional),'drillReg')}</div>`;}
function jefeCard(){const it=groupAvg(AP(),p=>p.jefe);if(it.length<2)return '';return `<div class="card"><div class="card-t">Desempeño por jefe <span style="font-weight:400;text-transform:none;font-size:11px">· toca para filtrar</span></div>${hbarsClickable(it,'drillJefe')}</div>`;}
function alertsCard(){const A=AP();let pdv0=0,pdvTot=0;A.forEach(p=>p.pdvs.forEach(x=>{pdvTot++;if((x.score||0)<=0)pdv0++;}));
  const crit=A.filter(p=>p.cumplimiento<50).length,worst=actOverall(A).slice().sort((a,b)=>a.rate-b.rate).slice(0,2);
  const items=[[pdv0,`PDV sin ninguna captura este mes (de ${pdvTot} asignados)`],[crit,`promotores en crítico, por debajo del 50%`]];
  worst.forEach(w=>items.push([w.rate+'%',`${w.label}: de las capturas más bajas del equipo`]));
  return `<div class="card"><div class="card-t">Focos rojos</div><div class="alerts">${items.map(([n,t])=>`<div class="alert"><div class="an">${n}</div><div>${t}</div></div>`).join("")}</div></div>`;}
function adminHTML(){
  const A=AP();
  const segTabs=(DATA.segmentos.length<2)?'':`<div class="segfilter">${[''].concat(DATA.segmentos.map(s=>s.segmento)).map(s=>`<button class="segtab ${adminSeg===s?'on':''}" onclick="setAdminSeg('${jss(s)}')">${s||'Todas'}</button>`).join('')}</div>`;
  if(A.length===0) return `<div class="wrap">${segTabs}<div class="card"><div class="empty">No hay promotores activos en <b>${esc(adminSeg)}</b> en este corte.</div></div></div>`;
  const gen=Math.round(A.reduce((s,p)=>s+p.cumplimiento,0)/A.length*10)/10,npdv=A.reduce((s,p)=>s+p.n_pdv,0),meta=A.filter(p=>p.cumplimiento>=META).length;
  const kpis=`<div class="kpis"><div class="kpi accent"><div class="k num">${gen}%</div><div class="l">Cumplimiento general</div></div><div class="kpi"><div class="k num">${A.length}</div><div class="l">Promotores</div></div><div class="kpi"><div class="k num">${npdv}</div><div class="l">PDV asignados</div></div><div class="kpi"><div class="k num is-${meta>0?'ok':'bad'}">${meta}</div><div class="l">En meta (≥${META}%)</div></div></div>`;
  const segList=adminSeg?DATA.segmentos.filter(s=>s.segmento===adminSeg):DATA.segmentos;
  const segCard=`<div class="card"><div class="card-t">Por sección</div>${segList.map(s=>{const b=band(s.cumpl_prom);return `<div class="segrow"><div class="big is-${b} num">${s.cumpl_prom}%</div><div><div style="font-weight:600">${esc(s.segmento)}</div><div class="meta-s">${s.n_prom} promotores · ${s.n_pdv} PDV · ${s.cumplen_95} en meta</div></div><span class="seg-badge ${s.segmento==='Punto de Venta'?'pv':''}" style="margin-left:auto">${(SEG_ACTS[s.segmento]||[]).length} capturas</span></div>`;}).join("")}</div>`;
  const covCard=`<div class="card"><div class="card-t">Cobertura por captura <span style="font-weight:400;text-transform:none;font-size:11px">· toca para ordenar</span></div>${actOverall(A).map(a=>{const b=bandBar(a.rate);return `<div class="cov" style="cursor:pointer" onclick="drillAct('${a.kind}')"><div class="cl">${esc(a.label)}</div><div class="cb"><i class="bg-${b}" style="width:${Math.max(a.rate,1)}%"></i></div><div class="cv is-${b} num">${a.rate}%</div></div>`;}).join("")}<div class="cap-note" style="margin-top:4px">Capacitaciones, Eventos, POP y Recambios se miden por asesor (conteo al mes), no por PDV.</div></div>`;
  const jefes=[...new Set(DATA.promotores.map(p=>p.jefe).filter(Boolean))].sort();
  const regs=[...new Set(DATA.promotores.map(promRegional))].sort();
  const table=`<div class="card" id="ranktop" style="padding:20px 20px 6px"><div class="card-t">Ranking de promotores</div><div class="tbar2"><input id="aq" placeholder="Buscar promotor o cédula…" value="${esc(aQuery)}"><select id="ajefe"><option value="">Todos los jefes</option>${jefes.map(j=>`<option ${aJefe===j?'selected':''} value="${esc(j)}">${esc(j)}</option>`).join("")}</select><select id="areg"><option value="">Todas las regionales</option>${regs.map(rg=>`<option ${aReg===rg?'selected':''} value="${esc(rg)}">${esc(rg)}</option>`).join("")}</select><button class="btn dark" onclick="exportCSV()">Descargar CSV</button></div></div><div class="tblwrap"><div class="scroll" id="ranktable">${rankTable()}</div></div>`;
  const jc=jefeCard(); const midGrid=jc?`<div class="grid2">${regionalCard()}${jc}</div>`:regionalCard();
  return `<div class="wrap">${segTabs}<div class="callout"><div>⚠</div><div><b>Nota:</b> 3 segmentos (SOLLA/DELICHIKS/SPG) por dominante. Voz del Mercado y Check-in por PDV; el resto por funcionario.</div></div>${kpis}${podioHTML()}<div class="grid2">${segCard}${distCard()}</div>${covCard}${midGrid}${alertsCard()}${mapCard()}${table}</div>`;
}
function sortA(k){if(aSort.key===k)aSort.dir*=-1;else{aSort.key=k;aSort.dir=(k==='nombre'||k==='segmento')?1:-1;}updateRank();}
function exportCSV(){let rows=DATA.promotores.filter(p=>{const q=aQuery.toLowerCase().trim();return (!q||p.nombre.toLowerCase().includes(q)||p.cedula.includes(q))&&(!aSeg||p.segmento===aSeg)&&(!aJefe||p.jefe===aJefe);});
  const g=(o,k)=>(o&&o[k]!=null)?o[k]:"";
  const head=["Cedula","Promotor","Seccion","Jefe","PDV","Cumplimiento_%","Check_%","Sugeridos_%","Actividades_%","Exhibiciones_%","Agotados_%","Capacitaciones_%","Eventos_%","POP_%","Recambios_%","Capac_n","Eventos_n","POP_n","Recambios_n"];
  const line=p=>[p.cedula,p.nombre,p.segmento,p.jefe,p.n_pdv,p.cumplimiento,g(p.rates,'checkin'),g(p.rates,'sugeridos'),g(p.rates,'actividades'),g(p.rates,'exhibiciones'),g(p.rates,'agotados'),g(p.rates,'capacitaciones'),g(p.rates,'eventos'),g(p.rates,'pop'),g(p.rates,'recambios'),g(p.counts,'capacitaciones'),g(p.counts,'eventos'),g(p.counts,'pop'),g(p.counts,'recambios')].map(v=>{v=(v==null?"":String(v));return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(";");
  const csv="\uFEFF"+[head.join(";"),...rows.map(line)].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="B&D_cumplimiento_"+DATA.periodo.replace(/\s/g,"_")+".csv";a.click();}

function render(){
  const app=document.getElementById('app');
  if(selected){app.innerHTML=detailHTML(selected);animateHero();}
  else if(mode==='admin'){app.innerHTML=adminHTML();wireAdmin();initMap();
  } else {app.innerHTML=homeHTML();
    const q=document.getElementById('q');if(q)q.oninput=e=>{homeQuery=e.target.value;const s=e.target.selectionStart;render();const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(s,s);}};}
  document.getElementById('foot').innerHTML=`SOLLA · operado por job&amp;talent &nbsp;·&nbsp; Datos DBD ${esc(DATA.periodo)} &nbsp;·&nbsp; Generado ${esc(DATA.generado)}`;
}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body></html>
